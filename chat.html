<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>\!!chat.título!!\</title>
</head>
<body style="margin: 0;">
    <aside class="listaConveres">
        <div class="converDisponible" id="agregar_conver" onclick="window.location.href = './comenzarConversacion/md'">
            + \!!chat.nueva_conversación!!\
        </div>
        <div class="converDisponible" id="uuid_de_conver" onclick="abrirConver('uuid_de_conver')">
            NOMBRE_CONVER
        </div>
        <div class="converDisponible cuenta" onclick="window.location.href = './configurarCuenta'">
            <img src="/app/fotoDePerfil?user=<!--UID-DE-USUARIO-->" width="36.8px" height="36.8px">
            <span><!--NOMBRE_DE_PERFIL--></span><br>
            <span><!--NOMBRE_DE_USUARIO--></span>
        </div>
    </aside>
    <main class="areaConverPrincipal" id="areaConverPrincipal">
        <div class="mensajes" id="mensajes"> <!--Espacio de mensajes-->
            <!--<div class="mensaje" id="muestra_de_mensaje" data-message-id="id_mensaje">
                <div class="respondiendoDiv" id="respondiendo_div_msg_id_mensaje">
                    ╭&nbsp;<img height="17.6px" height="17.6px" id="respondiendo_img_msg_id_mensaje" class="respItm">&nsbp;
                    <span class="respItm" id="respondiendo_usuario_msg_id_mensaje">usuario_respondiendo</span>
                    <span class="respItm" id="respondiendo_txt_msg_id_mensaje">texto_respondiendo</span>
                </div>
                <img src="/app/fotoDePerfil?user=uid" width="36.8px" height="36.8px" class="fotoDePerfilMensaje" id="fdp_msg_id_mensaje">
                <div class="mensajeMedio">
                    <div>
                        <span id="enviador_msg_id_mensaje">de_quien_es</span>
                        <span>cuando_se_ha_mandado</span>
                        editado_en
                    </div>
                    <div>
                        <span id="texto_msg_id_mensaje">texto_de_mensaje</span>
                    </div>
                </div>
            </div>-->
            <div class="noMostrar" id="espacioParaMensajeAntes"></div>
            <div class="noMostrar" id="espacioParaMensajeDespues"></div>
        </div>
        <div class="enviarMensajes" id="enviarMensajes">
            <div id="msgAResp" style="display: none;">
                ╭ <img height="17.6px" width="17.6px" id="msgARespImg" class="fotoDePerfilMensaje">&nbsp;
                <span id="msgARespTxt"></span>
                <button onclick="closeReplyMessage()" id="cerrarMsgAResp">X</button>
            </div>
            <input type="text" name="msg" id="msg" style="font-family: Arial, linjaLipamanka;" autofocus>
            <button type="button" onclick="enviarMensaje()" class="btnEnviarMsg">
                <img src="./assets/images/enviar.png" alt="Enviar Mensaje" class="btnEnviarMsg">
            </button>
        </div>
        <div style="display: none; position: absolute;" id="msg_context_menu" class="context_menu">
            <button onclick="setReplyMessage()" style="display: block; width: 100%;">\!!chat.responder_a_mensaje!!\</button>
            <button onclick="closeCtxMenu(document.getElementById('msg_context_menu'), 'msg')" style="display: block; width: 100%;">\!!chat.cerrar_menu_de_contexto_de_mensaje!!\</button>
        </div>
    </main>
    <script src="./socket.io/socket.io.js"></script>
    <script src="./client.js"></script>
    <script src="./chat.js"></script>
    <script>
        let inputTextoMsg = document.getElementById('msg');
        let shiftOprimido = false;
        inputTextoMsg.addEventListener('keydown', (e) => {
            if ((e.key === 'Enter') && (shiftOprimido === false)) {
                enviarMensaje();
            } else if (e.key === 'Shift') {
                shiftOprimido = true;
            }
        });
        inputTextoMsg.addEventListener('keyup', (e) => {
            if (e.key === 'Shift') {
                shiftOprimido = false;
            }
        });
        
        document.documentElement.style.setProperty(
            '--main-text-box-height',
            document.getElementById('enviarMensajes').offsetHeight + 'px'
        );
    </script>
</body>
</html>
